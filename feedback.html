<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Construct - Обратная связь</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="feedback-page">
    <header>
        <h1>Food Construct</h1>
        <nav class="nav-flex">
            <a href="index.html">Главная</a>
                <a href="lunch.html">Собрать ланч</a>
                <a href="feedback.html" class="active">Обратная связь</a>
                <a href="#contacts">Контакты</a>
                <a href="login.html">Вход</a>
        </nav>
    </header>

    <main>
        <section class="form-section">
            <h2>Обратная связь</h2>
            <form action="https://httpbin.org/post" method="POST" enctype="multipart/form-data" class="feedback-form">
                
                <div class="form-group">
                    <label for="fio">ФИО:</label>
                    <input type="text" id="fio" name="fio" required>
                </div>

                <div class="form-group">
                    <label for="email">Эл. почта:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label>Откуда вы узнали о нас?</label>
                    <div class="radio-group">
                        <label><input type="radio" name="source" value="internet" checked> Интернет</label>
                        <label><input type="radio" name="source" value="friends"> Друзья</label>
                        <label><input type="radio" name="source" value="ads"> Реклама</label>
                        <label><input type="radio" name="source" value="other"> Другое</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="type">Тип обращения:</label>
                    <select id="type" name="type">
                        <label>Тип обращения:</label>
                        <option value="suggestion">Предложение</option>
                        <option value="complaint">Жалоба</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Текст сообщения:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <div class="form-group">
                    <label for="file">Вложения (файл):</label>
                    <input type="file" id="file" name="attachment">
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="agreement" name="agreement" required>
                    <label for="agreement">Даю согласие на обработку персональных данных</label>
                </div>

                <button type="submit" class="btn-submit">Отправить</button>
            </form>
        </section>
    </main>

    <footer id="contacts">
        <p>Позвонить нам <a href="tel:+70000000000">+7-000-000-00-00</a></p>
    </footer>
</body>
</html>
